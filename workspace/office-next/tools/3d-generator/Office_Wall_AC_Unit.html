<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office_Wall_AC_Unit · Procedural PBR Generator</title>
<style>
  :root {
    --bg0: #07090d; --bg1: #121722; --panel: rgba(15, 19, 28, 0.78); --line: rgba(148, 163, 184, 0.16);
    --text: #e2e8f0; --muted: #8b97a8; --accent: #38bdf8; --accent2: #0ea5e9; --ok: #34d399;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; color: var(--text);
    font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(1200px 800px at 55% 40%, #1a2130 0%, var(--bg1) 35%, var(--bg0) 100%); }
  #viewport { position: fixed; inset: 0; }
  #viewport canvas { display: block; width: 100%; height: 100%; outline: none; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
  #info { top: 16px; left: 16px; padding: 14px 16px; max-width: 360px; }
  #info h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: 0.2px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  #info p { margin: 4px 0 12px; color: var(--muted); font-size: 12px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 999px;
    border: 1px solid var(--line); background: rgba(2, 6, 23, 0.55); font-size: 12px; white-space: nowrap; }
  .badge b { font-weight: 600; color: #f8fafc; font-variant-numeric: tabular-nums; }
  .badge .k { color: var(--muted); text-transform: uppercase; font-size: 10px; letter-spacing: 0.8px; }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .badge.warn .dot { background: #fbbf24; box-shadow: 0 0 8px #fbbf24; }
  details { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  summary { cursor: pointer; color: var(--muted); font-size: 12px; user-select: none; }
  #tree { margin: 8px 0 0; padding: 0; list-style: none; max-height: 34vh; overflow: auto;
    font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #cbd5e1; }
  #tree li span { color: var(--muted); }
  #tree li.grp { color: var(--accent); }
  #exportWrap { top: 16px; right: 16px; padding: 10px; display: flex; flex-direction: column; align-items: stretch; gap: 8px; min-width: 210px; }
  #exportBtn { appearance: none; border: 0; cursor: pointer; border-radius: 9px; padding: 13px 20px;
    font-size: 15px; font-weight: 700; letter-spacing: 0.3px; color: #04121c;
    background: linear-gradient(180deg, #7dd3fc 0%, var(--accent) 45%, var(--accent2) 100%);
    box-shadow: 0 0 0 1px rgba(125, 211, 252, 0.6) inset, 0 8px 24px rgba(14, 165, 233, 0.35);
    display: flex; align-items: center; justify-content: center; gap: 9px; transition: transform .08s ease, filter .15s ease; }
  #exportBtn:hover { filter: brightness(1.08); }
  #exportBtn:active { transform: translateY(1px); }
  #exportBtn:disabled { filter: grayscale(0.6) brightness(0.8); cursor: progress; }
  #exportBtn svg { width: 18px; height: 18px; }
  #exportMeta { color: var(--muted); font-size: 11px; text-align: center; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  #toast { color: var(--ok); font-size: 12px; text-align: center; min-height: 0; display: none; }
  #toast.err { color: #f87171; }
  #controls { left: 16px; bottom: 16px; padding: 10px 12px; display: flex; gap: 14px; align-items: center; }
  #controls label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; color: #cbd5e1; }
  #controls input { accent-color: var(--accent); }
  #hint { right: 16px; bottom: 16px; padding: 8px 12px; color: var(--muted); font-size: 12px; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; pointer-events: none; }
  @media (max-width: 640px) {
    #info { max-width: calc(100vw - 32px); right: 16px; top: auto; bottom: 64px; }
    #hint { display: none; }
  }
</style>
</head>
<body>
<div id="viewport"></div>
<div id="loading">Loading Three.js r128…</div>

<div id="info" class="panel">
  <h1>Office_Wall_AC_Unit</h1>
  <p>Modern commercial wall-mounted inverter AC · procedural PBR · metric (1 unit = 1 m)</p>
  <div class="badges">
    <span class="badge" id="dimBadge"><span class="dot"></span><span class="k">W × D × H</span><b id="dims">—</b></span>
    <span class="badge"><span class="k">Polygons</span><b id="polys">—</b></span>
    <span class="badge"><span class="k">Meshes</span><b id="meshes">—</b></span>
    <span class="badge"><span class="k">Materials</span><b id="mats">—</b></span>
  </div>
  <details>
    <summary>Export hierarchy</summary>
    <ul id="tree"></ul>
  </details>
</div>

<div id="exportWrap" class="panel">
  <button id="exportBtn" type="button" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
    Export GLB
  </button>
  <div id="exportMeta">Office_Wall_AC_Unit.glb · binary glTF 2.0</div>
  <div id="toast"></div>
</div>

<div id="controls" class="panel">
  <label><input type="checkbox" id="optWall" checked> Wall backdrop</label>
  <label><input type="checkbox" id="optWire"> Wireframe</label>
  <label><input type="checkbox" id="optSpin"> Auto-rotate</label>
</div>
<div id="hint" class="panel">Drag to orbit · Right-drag to pan · Scroll to zoom</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
<script>
(function () {
  'use strict';
  if (!window.THREE || !THREE.OrbitControls || !THREE.GLTFExporter) {
    document.getElementById('loading').textContent = 'Could not load Three.js r128 from the CDN. Check your connection and reload.';
    return;
  }
  document.getElementById('loading').remove();

  const V2 = THREE.Vector2, V3 = THREE.Vector3;
  const DEG = Math.PI / 180;

  // ───────────────────────────── Spec (metres) ─────────────────────────────
  const W = 0.85, D = 0.22, H = 0.30;
  const HALF_W = W / 2;               // 0.425
  const PLATE_T = 0.003;              // wall-mounting plate thickness (z 0 → 0.003)
  const REAR = PLATE_T;               // housing rear face
  const FRONT = 0.2188;               // housing front face; display glass + badge sit proud up to D
  const MID_HALF = 0.384;             // half-width of the central shell; end caps take over beyond
  const TRAY = { z0: 0.036, z1: 0.164, depth: 0.014 };   // top intake recess
  const LOUVER_DEG = 15;              // louver tilt below horizontal
  const LOUVER_PIVOT = new V3(0, 0.035, 0.110);
  const LOUVER_CHORD = 0.100;

  // Outlet geometry in side profile (z, y)
  const A = new V2(FRONT - 0.020, 0.095);     // underside of the front lip
  const B = new V2(0.102, 0.022);             // front of the bottom fillet
  const DUCT_C1 = new V2(0.085, 0.075), DUCT_C2 = new V2(0.130, 0.130);

  // ───────────────────────────── Materials ─────────────────────────────
  const lin = (hex) => new THREE.Color(hex).convertSRGBToLinear();

  const matWhite = new THREE.MeshStandardMaterial({ name: 'AC_Housing_White_Gloss', color: lin('#f8fafc'), roughness: 0.22, metalness: 0.05 });
  const matDuct  = new THREE.MeshStandardMaterial({ name: 'AC_Duct_Charcoal_Matte', color: lin('#1e293b'), roughness: 0.8, metalness: 0.0 });
  const matGlass = new THREE.MeshStandardMaterial({ name: 'AC_Display_Smoked_Glass', color: lin('#05080d'), roughness: 0.06, metalness: 0.0 });
  const matLED   = new THREE.MeshStandardMaterial({ name: 'AC_LED_Display_Emissive', color: lin('#05080d'), roughness: 0.06, metalness: 0.0,
                                                   emissive: lin('#38bdf8'), emissiveIntensity: 1.8, emissiveMap: makeLedTexture() });
  const badgeTex = makeBadgeTextures();
  const matChrome = new THREE.MeshStandardMaterial({ name: 'AC_Badge_Brushed_Chrome', color: lin('#ffffff'), map: badgeTex.color,
                                                    roughness: 0.15, metalness: 0.9, roughnessMap: badgeTex.mr, metalnessMap: badgeTex.mr });
  const matSteel = new THREE.MeshStandardMaterial({ name: 'AC_Mount_Galvanized_Steel', color: lin('#a3aab4'), roughness: 0.45, metalness: 0.75 });
  const allMaterials = [matWhite, matDuct, matGlass, matLED, matChrome, matSteel];

  // ───────────────────────────── Geometry helpers ─────────────────────────────
  function arc(cx, cy, r, a0, a1, n) {
    const out = [];
    for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; out.push(new V2(cx + r * Math.cos(a), cy + r * Math.sin(a))); }
    return out;
  }
  function cubic(p0, p1, p2, p3, n) {
    const out = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n, u = 1 - t;
      out.push(new V2(
        u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x,
        u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y));
    }
    return out;
  }
  const ductCurve = () => cubic(B, DUCT_C1, DUCT_C2, A, 32);   // B → A, solid on the left

  /** Side profile of the housing in (z, y). Returns points (CCW) and which segments are "dark" (duct / intake cavity). */
  function housingProfile({ notch, tray }) {
    const pts = [], dark = [];
    const add = (list, isDark) => {
      for (const p of list) {
        const last = pts[pts.length - 1];
        if (last && last.distanceTo(p) < 1e-7) continue;
        if (pts.length) dark[pts.length - 1] = isDark;
        pts.push(p.clone());
      }
    };
    const rr = 0.003;
    add([new V2(REAR + rr, 0)], false);
    add([new V2(0.080, 0)], false);                                       // flat underside
    add(arc(0.080, 0.022, 0.022, -90 * DEG, 0, 10), false);                // rounded bottom-front edge → B
    if (notch) add(ductCurve(), true); else add([A], false);              // discharge duct (or closed chord on end caps)
    add(arc(FRONT - 0.020, 0.115, 0.020, -90 * DEG, 0, 12), false);        // front lip fillet
    add([new V2(FRONT, 0.260)], false);                                    // flat front face
    add(arc(FRONT - 0.040, 0.260, 0.040, 0, 90 * DEG, 18), false);         // soft top-front fillet
    if (tray) {
      add([new V2(TRAY.z1, H)], false);
      add([new V2(TRAY.z1, H - TRAY.depth), new V2(TRAY.z0, H - TRAY.depth), new V2(TRAY.z0, H)], true);
    }
    add([new V2(REAR + rr, H)], false);
    add(arc(REAR + rr, H - rr, rr, 90 * DEG, 180 * DEG, 6), false);
    add([new V2(REAR, rr)], false);
    add(arc(REAR + rr, rr, rr, 180 * DEG, 270 * DEG, 6), false);
    if (pts[pts.length - 1].distanceTo(pts[0]) < 1e-7) pts.pop();
    dark[pts.length - 1] = false;
    return { pts, dark };
  }

  /** Extrude a (z, y) profile along world X from x0 to x1. Bevel keeps the exact outer profile (negative bevelOffset). */
  function extrudeProfileX(pts, x0, x1, bevel) {
    const shape = new THREE.Shape(pts);
    const width = x1 - x0;
    const opts = bevel
      ? { depth: width - 2 * bevel.t, bevelEnabled: true, bevelThickness: bevel.t, bevelSize: bevel.s, bevelOffset: -bevel.s, bevelSegments: bevel.n, curveSegments: 1 }
      : { depth: width, bevelEnabled: false, curveSegments: 1 };
    const g = new THREE.ExtrudeGeometry(shape, opts);
    g.rotateY(-Math.PI / 2);                 // shape-x → +Z, shape-y → +Y, extrusion → −X
    g.computeBoundingBox();
    g.translate(x0 - g.boundingBox.min.x, 0, 0);
    return g;
  }

  /** Extrude a front-view (x, y) shape along +Z so it spans zMin → zMax. */
  function extrudeShapeZ(shape, zMin, zMax, bevel, curveSegments = 10) {
    const depth = zMax - zMin;
    const opts = bevel
      ? { depth: depth - 2 * bevel.t, bevelEnabled: true, bevelThickness: bevel.t, bevelSize: bevel.s, bevelOffset: -bevel.s, bevelSegments: bevel.n, curveSegments }
      : { depth, bevelEnabled: false, curveSegments };
    const g = new THREE.ExtrudeGeometry(shape, opts);
    g.computeBoundingBox();
    g.translate(0, 0, zMin - g.boundingBox.min.z);
    return g;
  }

  function roundedRect(w, h, r, cx = 0, cy = 0) {
    const s = new THREE.Shape(), x = cx - w / 2, y = cy - h / 2;
    s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.absarc(x + w - r, y + r, r, -Math.PI / 2, 0, false);
    s.lineTo(x + w, y + h - r); s.absarc(x + w - r, y + h - r, r, 0, Math.PI / 2, false);
    s.lineTo(x + r, y + h); s.absarc(x + r, y + h - r, r, Math.PI / 2, Math.PI, false);
    s.lineTo(x, y + r); s.absarc(x + r, y + r, r, Math.PI, 1.5 * Math.PI, false);
    return s;
  }
  function slotPath(cx, cy, len, wid) {
    const p = new THREE.Path(), r = wid / 2, hx = len / 2 - r;
    p.moveTo(cx - hx, cy - r); p.lineTo(cx + hx, cy - r); p.absarc(cx + hx, cy, r, -Math.PI / 2, Math.PI / 2, false);
    p.lineTo(cx - hx, cy + r); p.absarc(cx - hx, cy, r, Math.PI / 2, 1.5 * Math.PI, false);
    return p;
  }

  /** Map UVs of an extruded front-view shape to 0..1 across its x/y bounds (for decals). */
  function planarUV(g) {
    g.computeBoundingBox();
    const bb = g.boundingBox, P = g.attributes.position, U = g.attributes.uv;
    const w = bb.max.x - bb.min.x, h = bb.max.y - bb.min.y;
    for (let i = 0; i < P.count; i++) U.setXY(i, (P.getX(i) - bb.min.x) / w, (P.getY(i) - bb.min.y) / h);
    U.needsUpdate = true;
  }

  /**
   * Turn a non-indexed ExtrudeGeometry into a clean, indexed, multi-material mesh geometry:
   *  - optional triangle removal (hidden faces), material classification per triangle
   *  - crease-angle smooth normals (curved fillets shade smoothly, hard edges stay crisp)
   *  - bevel rings take tangent-continuous normals from the flat face / straight wall they blend into
   */
  function finalize(src, { classify = null, remove = null, crease = 24, axis = 'x', bevelSnap = false, dropLids = false } = {}) {
    const P = src.attributes.position.array, UV = src.attributes.uv.array;
    const nTri = P.length / 9, lidFlag = new Uint8Array(nTri);
    src.groups.forEach(g => { if (g.materialIndex === 0) for (let t = g.start / 3; t < (g.start + g.count) / 3; t++) lidFlag[t] = 1; });
    const ax = axis === 'x' ? 0 : axis === 'y' ? 1 : 2;
    const a = new V3(), b = new V3(), c = new V3(), cen = new V3(), e1 = new V3(), e2 = new V3();
    const tris = [];
    for (let t = 0; t < nTri; t++) {
      a.fromArray(P, t * 9); b.fromArray(P, t * 9 + 3); c.fromArray(P, t * 9 + 6);
      cen.copy(a).add(b).add(c).multiplyScalar(1 / 3);
      if ((remove && remove(cen)) || (dropLids && lidFlag[t] === 1)) continue;
      const n = new V3().crossVectors(e1.subVectors(b, a), e2.subVectors(c, a));
      const area = n.length();
      if (area < 1e-14) continue;
      n.divideScalar(area);
      const lid = lidFlag[t] === 1;
      tris.push({ t, n, area, lid, wall: !lid && Math.abs(n.getComponent(ax)) < 1e-3, mat: classify ? classify(cen, lid) : 0 });
    }
    const key = (o) => Math.round(P[o] * 1e6) + ',' + Math.round(P[o + 1] * 1e6) + ',' + Math.round(P[o + 2] * 1e6);
    const buckets = new Map();
    tris.forEach((tr, i) => { for (let k = 0; k < 3; k++) { const kk = key(tr.t * 9 + k * 3); let arr = buckets.get(kk); if (!arr) buckets.set(kk, arr = []); arr.push(i); } });
    const cosC = Math.cos(crease * DEG), cosSnap = Math.cos(50 * DEG);
    const order = tris.map((_, i) => i).sort((i, j) => (tris[i].mat - tris[j].mat) || (i - j));
    const oP = [], oN = [], oU = [], groups = [];
    let cur = -1, start = 0;
    const nrm = new V3();
    order.forEach((i, idx) => {
      const tr = tris[i];
      if (tr.mat !== cur) { if (cur >= 0) groups.push([start * 3, (idx - start) * 3, cur]); cur = tr.mat; start = idx; }
      for (let k = 0; k < 3; k++) {
        const o = tr.t * 9 + k * 3;
        nrm.set(0, 0, 0);
        if (tr.lid) nrm.copy(tr.n);
        else {
          let lidN = null, hasWall = false; const cand = [];
          for (const j of buckets.get(key(o))) {
            const q = tris[j];
            if (q.lid) { if (bevelSnap && q.n.dot(tr.n) > cosSnap) lidN = q.n; continue; }
            if (q.mat !== tr.mat || q.n.dot(tr.n) < cosC) continue;
            cand.push(q); if (q.wall) hasWall = true;
          }
          if (lidN) nrm.copy(lidN);
          else { for (const q of cand) if (!(bevelSnap && hasWall && !q.wall)) nrm.addScaledVector(q.n, q.area); nrm.normalize(); }
        }
        oP.push(P[o], P[o + 1], P[o + 2]); oN.push(nrm.x, nrm.y, nrm.z);
        const u = (tr.t * 3 + k) * 2; oU.push(UV[u], UV[u + 1]);
      }
    });
    if (cur >= 0) groups.push([start * 3, (order.length - start) * 3, cur]);
    src.dispose();
    return indexify(oP, oN, oU, groups);
  }

  /** Weld identical vertices (position + normal + uv) into an indexed BufferGeometry, keeping groups. */
  function indexify(P, N, U, groups) {
    const map = new Map(), pos = [], nor = [], uv = [], index = [];
    for (let v = 0; v < P.length / 3; v++) {
      const k = [Math.round(P[v*3]*1e6), Math.round(P[v*3+1]*1e6), Math.round(P[v*3+2]*1e6),
                 Math.round(N[v*3]*1e4), Math.round(N[v*3+1]*1e4), Math.round(N[v*3+2]*1e4),
                 Math.round(U[v*2]*1e5), Math.round(U[v*2+1]*1e5)].join(',');
      let id = map.get(k);
      if (id === undefined) { id = pos.length / 3; map.set(k, id); pos.push(P[v*3], P[v*3+1], P[v*3+2]); nor.push(N[v*3], N[v*3+1], N[v*3+2]); uv.push(U[v*2], U[v*2+1]); }
      index.push(id);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.setIndex(index);
    groups.forEach(([s, c, m]) => g.addGroup(s, c, m));
    g.computeBoundingBox(); g.computeBoundingSphere();
    return g;
  }

  function distToSeg(p, a, b) {
    const abx = b.x - a.x, aby = b.y - a.y, l2 = abx * abx + aby * aby;
    let t = l2 > 0 ? ((p.x - a.x) * abx + (p.y - a.y) * aby) / l2 : 0;
    t = Math.max(0, Math.min(1, t));
    const dx = a.x + abx * t - p.x, dy = a.y + aby * t - p.y;
    return Math.sqrt(dx * dx + dy * dy);
  }
  function nearestSeg(pts, q) {
    let best = -1, bd = Infinity;
    for (let i = 0; i < pts.length; i++) { const d = distToSeg(q, pts[i], pts[(i + 1) % pts.length]); if (d < bd) { bd = d; best = i; } }
    return best;
  }

  function mesh(name, geo, material, { cast = true, receive = true } = {}) {
    const m = new THREE.Mesh(geo, material);
    m.name = name; m.castShadow = cast; m.receiveShadow = receive;
    return m;
  }
  function group(name, parent) { const g = new THREE.Group(); g.name = name; if (parent) parent.add(g); return g; }

  // ───────────────────────────── Textures (procedural canvases) ─────────────────────────────
  function makeLedTexture() {
    const cw = 768, ch = 256, cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
    const g = cv.getContext('2d');
    g.fillStyle = '#000'; g.fillRect(0, 0, cw, ch);
    const family = '"Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif';
    const big = `300 176px ${family}`, small = `400 80px ${family}`;
    g.font = big; const w1 = g.measureText('24').width;
    g.font = small; const w2 = g.measureText('°C').width;
    const gap = 6, x0 = (cw - (w1 + gap + w2)) / 2 + 18, base = 196;
    for (const pass of [{ blur: 26, alpha: 0.55 }, { blur: 8, alpha: 0.9 }, { blur: 0, alpha: 1 }]) {
      g.shadowColor = `rgba(255,255,255,${pass.alpha})`; g.shadowBlur = pass.blur;
      g.fillStyle = `rgba(255,255,255,${pass.alpha})`;
      g.font = big; g.fillText('24', x0, base);
      g.font = small; g.fillText('°C', x0 + w1 + gap, base - 82);
    }
    // minimalist mode glyph (snowflake) + status dot, dimmer than the readout
    g.shadowBlur = 10; g.shadowColor = 'rgba(255,255,255,0.6)';
    g.strokeStyle = 'rgba(255,255,255,0.55)'; g.lineWidth = 6; g.lineCap = 'round';
    const sx = 92, sy = 128, sr = 30;
    for (let i = 0; i < 3; i++) {
      const ang = i * Math.PI / 3, dx = Math.cos(ang) * sr, dy = Math.sin(ang) * sr;
      g.beginPath(); g.moveTo(sx - dx, sy - dy); g.lineTo(sx + dx, sy + dy); g.stroke();
    }
    g.fillStyle = 'rgba(255,255,255,0.5)'; g.beginPath(); g.arc(cw - 70, 70, 9, 0, Math.PI * 2); g.fill();
    const tex = new THREE.CanvasTexture(cv);
    tex.encoding = THREE.sRGBEncoding; tex.anisotropy = 8; tex.name = 'LED_24C_Emissive';
    return tex;
  }

  function makeBadgeTextures() {
    // base colour: brushed streaks + engraved wordmark
    const cw = 1024, ch = 208, cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
    const g = cv.getContext('2d');
    const grd = g.createLinearGradient(0, 0, cw, ch);
    grd.addColorStop(0, '#d9dde2'); grd.addColorStop(0.5, '#f1f3f5'); grd.addColorStop(1, '#cfd4da');
    g.fillStyle = grd; g.fillRect(0, 0, cw, ch);
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 1400; i++) {
      const y = rnd() * ch, x = rnd() * cw * 0.6 - cw * 0.1, len = cw * (0.25 + rnd() * 0.9);
      const l = rnd() > 0.5; g.strokeStyle = l ? `rgba(255,255,255,${0.05 + rnd() * 0.12})` : `rgba(90,98,110,${0.04 + rnd() * 0.10})`;
      g.lineWidth = 0.6 + rnd() * 1.4; g.beginPath(); g.moveTo(x, y); g.lineTo(x + len, y + (rnd() - 0.5) * 0.8); g.stroke();
    }
    const text = 'INVERTER', family = '"Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif';
    g.font = `600 104px ${family}`; g.textBaseline = 'middle';
    const spacing = 26; let total = 0; const widths = [...text].map(chr => { const w = g.measureText(chr).width; total += w; return w; });
    total += spacing * (text.length - 1);
    const drawWord = (dx, dy, style) => { g.fillStyle = style; let x = (cw - total) / 2 + dx; [...text].forEach((chr, i) => { g.fillText(chr, x, ch / 2 + 6 + dy); x += widths[i] + spacing; }); };
    drawWord(0, 2.5, 'rgba(255,255,255,0.85)');   // engraved lower highlight
    drawWord(0, 0, '#4b5360');
    const color = new THREE.CanvasTexture(cv); color.encoding = THREE.sRGBEncoding; color.anisotropy = 8; color.name = 'Badge_Brushed_BaseColor';
    // metallic-roughness (glTF packing: G = roughness, B = metalness)
    const mv = document.createElement('canvas'); mv.width = 512; mv.height = 104;
    const m = mv.getContext('2d'); m.fillStyle = 'rgb(0,230,255)'; m.fillRect(0, 0, 512, 104);
    for (let i = 0; i < 700; i++) {
      const y = rnd() * 104, gch = Math.round(185 + rnd() * 70);
      m.strokeStyle = `rgba(0,${gch},255,0.7)`; m.lineWidth = 0.5 + rnd(); m.beginPath(); m.moveTo(rnd() * 200 - 60, y); m.lineTo(rnd() * 400 + 200, y); m.stroke();
    }
    const mr = new THREE.CanvasTexture(mv); mr.anisotropy = 8; mr.name = 'Badge_Brushed_MetalRough';
    return { color, mr };
  }

  // ───────────────────────────── Build the model ─────────────────────────────
  function buildACUnit() {
    const root = group('Office_Wall_AC_Unit');

    // ── Housing ──
    const housing = group('Housing', root);
    {
      const prof = housingProfile({ notch: true, tray: true });
      const shellSrc = extrudeProfileX(prof.pts, -MID_HALF - 0.0004, MID_HALF + 0.0004, null);   // 0.4 mm tuck under the caps hides the join
      const shell = finalize(shellSrc, {
        classify: (cen, lid) => lid ? 0 : (prof.dark[nearestSeg(prof.pts, new V2(cen.z, cen.y))] ? 1 : 0),
        crease: 24, dropLids: true,   // shell ends sit inside the end caps and are never visible
      });
      housing.add(mesh('Housing_Main_Shell', shell, [matWhite, matDuct]));

      // End caps: solid profile, filleted outer edges; inner (hidden) bevel faces are stripped so the join is seamless.
      const capProf = housingProfile({ notch: false, tray: false });
      const bev = { t: 0.012, s: 0.010, n: 8 };
      const capR = finalize(extrudeProfileX(capProf.pts, MID_HALF - bev.t, HALF_W, bev), { remove: (c) => c.x < MID_HALF - 1e-6, crease: 24, bevelSnap: true });
      const capL = finalize(extrudeProfileX(capProf.pts, -HALF_W, -MID_HALF + bev.t, bev), { remove: (c) => c.x > -MID_HALF + 1e-6, crease: 24, bevelSnap: true });
      housing.add(mesh('Housing_EndCap_R', capR, matWhite));
      housing.add(mesh('Housing_EndCap_L', capL, matWhite));
    }

    // ── Top air intake: slotted grille over a dark recessed cavity ──
    const intake = group('Top_Air_Intake', root);
    {
      const span = 0.72, nSlats = 11, gap = 0.0074, width = TRAY.z1 - TRAY.z0;
      const slatW = (width - gap * (nSlats - 1)) / nSlats, slatH = 0.0115, topY = H - 0.0006;
      const slatGeo = new THREE.BoxGeometry(span, slatH, slatW);
      for (let i = 0; i < nSlats; i++) {
        const s = mesh(`Intake_Slat_${String(i + 1).padStart(2, '0')}`, slatGeo, matWhite);
        s.position.set(0, topY - slatH / 2, TRAY.z0 + slatW / 2 + i * (slatW + gap));
        intake.add(s);
      }
      const frameW = MID_HALF - span / 2;
      const frameGeo = new THREE.BoxGeometry(frameW, TRAY.depth, width);
      [-1, 1].forEach(sgn => {
        const f = mesh(sgn < 0 ? 'Intake_Frame_L' : 'Intake_Frame_R', frameGeo, matWhite);
        f.position.set(sgn * (span / 2 + frameW / 2), H - TRAY.depth / 2, (TRAY.z0 + TRAY.z1) / 2);
        intake.add(f);
      });
    }

    // ── Air discharge: dark duct, vertical swing vanes, louver flap ──
    const discharge = group('Air_Discharge', root);
    {
      const duct = ductCurve();
      // duct end walls (close the cavity against the end caps)
      const endGeoR = finalize(extrudeProfileX(duct, MID_HALF - 0.0012, MID_HALF, null), { crease: 24 });
      const endGeoL = finalize(extrudeProfileX(duct, -MID_HALF, -MID_HALF + 0.0012, null), { crease: 24 });
      discharge.add(mesh('Duct_EndWall_R', endGeoR, matDuct));
      discharge.add(mesh('Duct_EndWall_L', endGeoL, matDuct));

      // vertical vanes: duct section inset 3 mm from the walls and 12 mm behind the outlet plane
      const cdir = new V2().subVectors(A, B).normalize(), nIn = new V2(-cdir.y, cdir.x);
      const vane = [];
      for (let i = 0; i < duct.length; i++) {
        const p = duct[i], q = duct[Math.min(i + 1, duct.length - 1)], r = duct[Math.max(i - 1, 0)];
        const d = new V2().subVectors(q, r).normalize(), nCav = new V2(d.y, -d.x);   // right-hand normal → into cavity
        const o = p.clone().addScaledVector(nCav, 0.003);
        if (new V2().subVectors(o, B).dot(nIn) >= 0.012) vane.push(o);
      }
      const vaneGeo = finalize(extrudeProfileX(vane, -0.00075, 0.00075, null), { crease: 30 });
      const nVanes = 12;
      for (let i = 0; i < nVanes; i++) {
        const v = mesh(`Duct_Swing_Vane_${String(i + 1).padStart(2, '0')}`, vaneGeo, matDuct);
        v.position.x = -0.33 + i * (0.66 / (nVanes - 1));
        discharge.add(v);
      }

      // louver flap: thin cambered aerofoil, tilted 15° below horizontal about its rear pivot
      const pivot = group('Louver_Pivot', discharge);
      pivot.position.copy(LOUVER_PIVOT);
      pivot.rotation.x = LOUVER_DEG * DEG;
      const L = LOUVER_CHORD, N = 36, sag = 0.0028;
      const yc = (s) => -sag * 4 * s * (1 - s);
      const th = (s) => 0.0017 + 0.0021 * Math.pow(Math.sin(Math.PI * s), 0.7);
      const prof = [];
      for (let i = 0; i <= N; i++) { const s = i / N; prof.push(new V2(s * L, yc(s) - th(s) / 2)); }               // underside, rear → front
      arc(L, yc(1), th(1) / 2, -90 * DEG, 90 * DEG, 6).slice(1, -1).forEach(p => prof.push(p));                    // rounded leading tip
      for (let i = N; i >= 0; i--) { const s = i / N; prof.push(new V2(s * L, yc(s) + th(s) / 2)); }              // upper side, front → rear
      arc(0, yc(0), th(0) / 2, 90 * DEG, 270 * DEG, 6).slice(1, -1).forEach(p => prof.push(p));                    // rounded trailing tip
      const flapGeo = finalize(extrudeProfileX(prof, -0.372, 0.372, { t: 0.0016, s: 0.0005, n: 3 }), { crease: 32, bevelSnap: true });
      pivot.add(mesh('Louver_Flap', flapGeo, matWhite));
      const pinGeo = new THREE.CylinderGeometry(0.0028, 0.0028, MID_HALF - 0.0012 - 0.371, 20);
      pinGeo.rotateZ(Math.PI / 2);
      [-1, 1].forEach(sgn => {
        const pin = mesh(sgn < 0 ? 'Louver_Pivot_Pin_L' : 'Louver_Pivot_Pin_R', pinGeo, matDuct);
        pin.position.set(sgn * (0.371 + (MID_HALF - 0.0012 - 0.371) / 2), 0.0, 0.006);
        pivot.add(pin);
      });
    }

    // ── Front display: smoked glass window + emissive "24°C" readout ──
    const display = group('Front_Display', root);
    {
      const cx = 0.292, cy = 0.205, w = 0.080, h = 0.030;
      const bezelSrc = extrudeShapeZ(roundedRect(w, h, 0.0045, cx, cy), FRONT - 0.0004, FRONT + 0.0008, { t: 0.0004, s: 0.0004, n: 3 });
      display.add(mesh('Display_Glass_Window', finalize(bezelSrc, { axis: 'z', crease: 30, bevelSnap: true }), matGlass));
      const ledGeo = new THREE.PlaneGeometry(0.069, 0.023);
      const led = mesh('LED_Display_24C', ledGeo, matLED, { cast: false, receive: false });
      led.position.set(cx, cy, FRONT + 0.00085);
      display.add(led);
    }

    // ── Brand plate: brushed chrome badge, lower-right ──
    {
      const bw = 0.060, bh = 0.0125;
      const src = extrudeShapeZ(roundedRect(bw, bh, 0.0022, 0.336, 0.133), FRONT - 0.0003, D, { t: 0.0004, s: 0.0004, n: 3 }, 8);
      planarUV(src);
      root.add(mesh('Brand_Plate_Chrome', finalize(src, { axis: 'z', crease: 30, bevelSnap: true }), matChrome));
    }

    // ── Rear wall-mounting plate (origin = centre of its bottom edge) ──
    {
      const s = new THREE.Shape(); const pw = 0.80, ph = 0.27;
      s.moveTo(-pw / 2, 0); s.lineTo(pw / 2, 0); s.lineTo(pw / 2, ph); s.lineTo(-pw / 2, ph); s.lineTo(-pw / 2, 0);
      [-0.30, -0.10, 0.10, 0.30].forEach(x => { s.holes.push(slotPath(x, 0.235, 0.050, 0.010)); s.holes.push(slotPath(x, 0.040, 0.050, 0.010)); });
      [-0.34, 0.34].forEach(x => { const p = new THREE.Path(); p.absarc(x, 0.12, 0.014, 0, Math.PI * 2, false); s.holes.push(p); });
      [-0.20, 0, 0.20].forEach(x => s.holes.push(slotPath(x, 0.135, 0.012, 0.006)));
      const plate = finalize(extrudeShapeZ(s, 0, PLATE_T, null, 16), { axis: 'z', crease: 30 });
      root.add(mesh('Wall_Mounting_Plate', plate, matSteel));
    }

    root.updateMatrixWorld(true);
    return root;
  }

  // ───────────────────────────── Measurements ─────────────────────────────
  function measure(root) {
    root.updateMatrixWorld(true);
    const box = new THREE.Box3(), v = new V3();
    let tris = 0, meshes = 0; const mats = new Set();
    root.traverse(o => {
      if (!o.isMesh) return;
      meshes++;
      const g = o.geometry, P = g.attributes.position;
      for (let i = 0; i < P.count; i++) box.expandByPoint(v.fromBufferAttribute(P, i).applyMatrix4(o.matrixWorld));
      tris += (g.index ? g.index.count : P.count) / 3;
      (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => mats.add(m));
    });
    return { box, size: box.getSize(new V3()), tris, meshes, materials: mats.size };
  }

  // ───────────────────────────── Preview scene ─────────────────────────────
  const container = document.getElementById('viewport');
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  renderer.physicallyCorrectLights = true;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.environment = buildStudioEnvironment(renderer);

  const camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.01, 50);
  camera.position.set(0.78, 0.20, 1.18);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.14, 0.11);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.minDistance = 0.3; controls.maxDistance = 5;
  controls.autoRotateSpeed = 1.2;
  controls.update();

  // Lights (preview only — never part of the export)
  const key = new THREE.DirectionalLight(0xfff4e8, 3.2);
  key.position.set(1.1, 1.6, 2.0);
  key.target.position.set(0, 0.12, 0.1);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  Object.assign(key.shadow.camera, { left: -0.75, right: 0.75, top: 0.75, bottom: -0.75, near: 0.5, far: 6 });
  key.shadow.bias = -0.0004; key.shadow.normalBias = 0.0025; key.shadow.radius = 4;
  const fill = new THREE.DirectionalLight(0xcfe3ff, 0.9);
  fill.position.set(-1.8, 0.4, 1.4);
  const rim = new THREE.DirectionalLight(0xffffff, 1.1);
  rim.position.set(-0.4, 1.8, -1.2);
  scene.add(key, key.target, fill, rim);

  // Studio wall backdrop (preview only)
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(9, 6), new THREE.MeshStandardMaterial({ color: lin('#262c36'), roughness: 0.92, metalness: 0 }));
  wall.name = '__preview_wall'; wall.position.set(0, 0.15, -0.0008); wall.receiveShadow = true;
  scene.add(wall);

  const ac = buildACUnit();
  scene.add(ac);

  function buildStudioEnvironment(r) {
    const env = new THREE.Scene();
    const room = new THREE.Mesh(new THREE.BoxGeometry(12, 7, 12), new THREE.MeshBasicMaterial({ color: lin('#14181f'), side: THREE.BackSide }));
    room.position.y = 2; env.add(room);
    const panel = (w, h, pos, look, color, k) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: lin(color).multiplyScalar(k), side: THREE.DoubleSide }));
      m.position.copy(pos); m.lookAt(look); env.add(m);
    };
    const o = new V3(0, 0, 0);
    panel(5.0, 2.2, new V3(0, 5.2, 1.0), o, '#ffffff', 2.6);       // overhead softbox
    panel(2.2, 3.2, new V3(4.5, 1.8, 4.0), o, '#fff3e6', 4.2);     // key softbox, front-right
    panel(0.9, 4.0, new V3(-5.2, 1.6, 2.0), o, '#dbeafe', 2.6);    // strip, left
    panel(9.0, 5.0, new V3(-0.4, 0.6, 5.9), o, '#f4f7fb', 1.5);     // broad front softbox (reads on chrome + gloss)
    panel(6.0, 1.2, new V3(0, -1.4, 0), new V3(0, 1, 0), '#3b4252', 0.8); // floor bounce
    const pm = new THREE.PMREMGenerator(r);
    const rt = pm.fromScene(env, 0.035);
    pm.dispose();
    return rt.texture;
  }

  // ───────────────────────────── UI ─────────────────────────────
  const stats = measure(ac);
  const fmt = (n) => n.toFixed(3);
  document.getElementById('dims').textContent = `${fmt(stats.size.x)} × ${fmt(stats.size.z)} × ${fmt(stats.size.y)} m`;
  const within = Math.abs(stats.size.x - W) < 5e-4 && Math.abs(stats.size.z - D) < 5e-4 && Math.abs(stats.size.y - H) < 5e-4;
  const dimBadge = document.getElementById('dimBadge');
  dimBadge.title = `Target ${W} × ${D} × ${H} m · origin at bottom-centre of the rear mounting plate\n` +
    `min (${fmt(stats.box.min.x)}, ${fmt(stats.box.min.y)}, ${fmt(stats.box.min.z)})  max (${fmt(stats.box.max.x)}, ${fmt(stats.box.max.y)}, ${fmt(stats.box.max.z)})`;
  if (!within) dimBadge.classList.add('warn');
  document.getElementById('polys').textContent = `${stats.tris.toLocaleString('en-US')} tris`;
  document.getElementById('meshes').textContent = stats.meshes;
  document.getElementById('mats').textContent = stats.materials;

  const tree = document.getElementById('tree');
  (function walk(o, depth) {
    const li = document.createElement('li');
    const tris = o.isMesh ? (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3 : 0;
    li.className = o.isMesh ? '' : 'grp';
    li.style.paddingLeft = (depth * 12) + 'px';
    li.textContent = (o.isMesh ? '▪ ' : '▾ ') + o.name;
    if (o.isMesh) { const sp = document.createElement('span'); sp.textContent = `  ${tris.toLocaleString('en-US')}`; li.appendChild(sp); }
    tree.appendChild(li);
    o.children.forEach(c => walk(c, depth + 1));
  })(ac, 0);

  document.getElementById('optWall').addEventListener('change', e => { wall.visible = e.target.checked; });
  document.getElementById('optWire').addEventListener('change', e => { allMaterials.forEach(m => { m.wireframe = e.target.checked; }); });
  document.getElementById('optSpin').addEventListener('change', e => { controls.autoRotate = e.target.checked; });

  // KHR_materials_emissive_strength: keeps emissiveIntensity 1.8 exact instead of an out-of-range emissiveFactor
  class EmissiveStrengthExtension {
    constructor(writer) { this.writer = writer; this.name = 'KHR_materials_emissive_strength'; }
    writeMaterial(material, def) {
      if (!material.isMeshStandardMaterial || !material.emissive || material.emissiveIntensity <= 1) return;
      def.emissiveFactor = material.emissive.toArray();
      def.extensions = def.extensions || {};
      def.extensions[this.name] = { emissiveStrength: material.emissiveIntensity };
      this.writer.extensionsUsed[this.name] = true;
    }
  }

  const btn = document.getElementById('exportBtn'), toast = document.getElementById('toast');
  const say = (msg, err) => { toast.textContent = msg; toast.className = err ? 'err' : ''; toast.style.display = 'block'; };
  btn.disabled = false;

  function exportGLB(onBuffer) {
    const wire = allMaterials.map(m => m.wireframe);
    allMaterials.forEach(m => { m.wireframe = false; });
    const exporter = new THREE.GLTFExporter();
    exporter.register(w => new EmissiveStrengthExtension(w));
    exporter.parse(ac, (result) => {
      allMaterials.forEach((m, i) => { m.wireframe = wire[i]; });
      onBuffer(result);
    }, { binary: true, onlyVisible: true, maxTextureSize: 2048 });
  }
  window.__exportGLB = exportGLB;   // handy for automation

  btn.addEventListener('click', () => {
    btn.disabled = true; say('Exporting…');
    try {
      exportGLB((buffer) => {
        const blob = new Blob([buffer], { type: 'model/gltf-binary' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'Office_Wall_AC_Unit.glb';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
        say(`Saved Office_Wall_AC_Unit.glb · ${(buffer.byteLength / 1024).toFixed(0)} KB`);
        btn.disabled = false;
      });
    } catch (err) {
      console.error(err); say('Export failed: ' + err.message, true); btn.disabled = false;
    }
  });

  // ───────────────────────────── Loop ─────────────────────────────
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
  window.__ac = { ac, stats, camera, controls, renderer };
})();
</script>
</body>
</html>
