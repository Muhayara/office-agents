<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Office_Indoor_Plant — plant pack GLB generator</title>
<style>
  html,body{margin:0;height:100%;background:#e8ecee;font:14px/1.45 system-ui,sans-serif;color:#182329;overflow:hidden}
  #v{position:fixed;inset:0}
  #ui{position:fixed;left:12px;top:12px;width:260px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.88);box-shadow:0 2px 14px rgba(0,0,0,.18)}
  h1{font-size:15px;margin:0 0 8px}
  select{font:inherit;width:100%;padding:6px;margin-bottom:8px;border-radius:8px;border:1px solid #b9c4c9}
  #dims{font:12px ui-monospace,Menlo,monospace;margin:0 0 10px;white-space:pre;color:#34454d}
  button{font:inherit;padding:8px 12px;border:0;border-radius:8px;background:#182329;color:#fff;cursor:pointer;margin:0 6px 6px 0}
  button.alt{background:#c9d3d8;color:#182329}
  #st{font-size:12px;color:#4a5a62;min-height:18px}
</style>
</head>
<body>
<div id="v"></div>
<div id="ui">
  <h1>Office_Indoor_Plant</h1>
  <select id="type"></select>
  <div id="dims"></div>
  <button id="exp">Export GLB</button><button id="rot" class="alt">Auto-rotate</button>
  <div id="st">Drag to orbit · scroll to zoom</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
<script>
/* Metres, Y-up, origin = floor centre under the pot. Export root is always "Office_Indoor_Plant". */
const V3 = THREE.Vector3, Q = THREE.Quaternion, M4 = THREE.Matrix4, UP = new V3(0, 1, 0), DS = THREE.DoubleSide;
const mk = (name, hex, metal, rough, extra = {}) => {
  const m = new THREE.MeshStandardMaterial(Object.assign({ metalness: metal, roughness: rough }, extra));
  m.color = new THREE.Color(hex).convertSRGBToLinear(); m.name = name; return m;   // sRGB hex -> linear for GLB
};
const flat = g => { const n = g.index ? g.toNonIndexed() : g; n.computeVertexNormals(); return n; };
const grp = n => { const g = new THREE.Group(); g.name = n; return g; };
const part = (g, m, name) => { const o = new THREE.Mesh(g, m); o.name = name; return o; };
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const dirOf = (az, el) => new V3(Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az));
const tube = (pts, r, seg = 10) => flat(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), seg, r, 5, false));

function exactBox(obj) {   // r128 Box3.setFromObject inflates rotated meshes, so measure vertices
  obj.updateMatrixWorld(true);
  const b = new THREE.Box3(), v = new V3();
  obj.traverse(o => { if (o.isMesh) { const p = o.geometry.attributes.position;
    for (let i = 0; i < p.count; i++) b.expandByPoint(v.fromBufferAttribute(p, i).applyMatrix4(o.matrixWorld)); } });
  return b;
}

/* Generic blade: length along +Y, width along X, normal +Z. hw(t) = half width at t in 0..1 */
function blade(L, hw, fold, droop, n = 8) {
  const P = [], v = (t, s) => { const y = t * L, x = s * hw(t); return [x, y, fold * Math.abs(x) - droop * y * y / L]; };
  for (let i = 0; i < n; i++) {
    const a = i / n, b = (i + 1) / n, A0 = v(a, -1), A1 = v(a, 0), A2 = v(a, 1), B0 = v(b, -1), B1 = v(b, 0), B2 = v(b, 1);
    P.push(...A1, ...A2, ...B2, ...A1, ...B2, ...B1, ...A0, ...A1, ...B1, ...A0, ...B1, ...B0);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3)); g.computeVertexNormals(); return g;
}
function frame(dir, ref, roll = 0) {   // quaternion: local Y -> dir, local Z -> ref projected perpendicular to dir
  const z = ref.clone().sub(dir.clone().multiplyScalar(ref.dot(dir))).normalize(), x = new V3().crossVectors(dir, z);
  const q = new Q().setFromRotationMatrix(new M4().makeBasis(x, dir, z));
  if (roll) q.premultiply(new Q().setFromAxisAngle(dir, roll)); return q;
}
const bake = (out, geo, m) => { const p = geo.attributes.position, v = new V3();
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i).applyMatrix4(m); out.push(v.x, v.y, v.z); } };
const meshOf = (arr, mat, name) => { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3)); g.computeVertexNormals(); return part(g, mat, name); };

/* Pinnate frond builder (areca palm, ZZ plant): arching rachis + leaflet pairs merged into one mesh */
function pinnate(fol, o) {
  const unit = blade(1, o.hw, o.fold, o.droop, 6);
  for (let i = 0; i < o.n; i++) {
    const az = i / o.n * Math.PI * 2 + rnd() * 0.3, sa = Math.sin(az), ca = Math.cos(az), H = o.h * (0.75 + rnd() * 0.5), R = o.reach * (0.75 + rnd() * 0.5);
    const pts = [[0.015, -0.02, 0.015], [0.15 * R, 0.5 * H, 0.15 * R], [0.6 * R, 0.95 * H, 0.6 * R], [R, 0.85 * H, R]]
      .map(([a, y, b]) => new V3(a * sa, y, b * ca));
    const c = new THREE.CatmullRomCurve3(pts), arr = [];
    fol.add(part(tube(pts, o.stemR, 12), o.stem, o.name + '_Stem_' + (i + 1)));
    for (let k = 0; k < o.pairs; k++) {
      const t = 0.2 + 0.8 * k / (o.pairs - 1), p = c.getPoint(t), T = c.getTangent(t), B = new V3().crossVectors(T, UP).normalize();
      const len = o.L * (0.6 + 0.4 * Math.sin(Math.PI * Math.min(1, t * 1.05)));
      [-1, 1].forEach(s => {
        const d = T.clone().multiplyScalar(Math.cos(o.ang)).addScaledVector(B, s * Math.sin(o.ang)); d.y -= o.droopDir; d.normalize();
        bake(arr, unit, new M4().compose(p, frame(d, UP), new V3(len * o.W / o.L, len, len)));
      });
    }
    bake(arr, unit, new M4().compose(c.getPoint(1), frame(c.getTangent(1), UP), new V3(o.W * 0.8, o.L, o.L)));   // tip leaflet
    fol.add(meshOf(arr, o.leaf[i % o.leaf.length], o.name + '_Frond_' + (i + 1)));
  }
}

/* ---------- Plant builders: foliage group origin = soil level ---------- */
function snake(fol) {
  const A = mk('Snake_Leaf_Deep', 0x2d5a3d, 0, 0.6, { side: DS }), B = mk('Snake_Leaf_Light', 0x4b7f4f, 0, 0.6, { side: DS });
  const hw = t => 0.045 * Math.min(1, 0.55 + 3 * t) * Math.pow(1 - t, 0.5);
  for (let i = 0; i < 13; i++) {
    const az = i * 2.4 + rnd() * 0.3, r = 0.015 + 0.055 * rnd(), sa = Math.sin(az), ca = Math.cos(az);
    const L = (1 - r / 0.07 * 0.5) * (0.55 + 0.45 * rnd()), el = (80 + 8 * rnd()) * Math.PI / 180;
    const m = part(blade(L, hw, 0.35, 0.05), i % 2 ? B : A, 'Snake_Blade_' + (i + 1));
    m.position.set(r * sa, -0.02, r * ca); m.quaternion.copy(frame(dirOf(az, el), new V3(sa, 0, ca), (rnd() - 0.5) * 0.3)); fol.add(m);
  }
}
function fiddle(fol) {
  const A = mk('Fiddle_Leaf_Deep', 0x3b7a3e, 0, 0.5, { side: DS }), B = mk('Fiddle_Leaf_Fresh', 0x4f9150, 0, 0.5, { side: DS }), T = mk('Trunk_Bark', 0x6b5240, 0, 0.9);
  fol.add(part(tube([new V3(0, -0.02, 0), new V3(0.012, 0.3, 0.008), new V3(-0.008, 0.6, -0.006), new V3(0.004, 0.9, 0.004)], 0.02, 12), T, 'Trunk'));
  const hw = t => 0.13 * Math.pow(Math.sin(Math.PI * Math.pow(t, 0.75)), 0.8) * (1 - 0.3 * Math.exp(-(((t - 0.38) / 0.12) ** 2))) * (0.7 + 0.5 * t) * 0.9;
  for (let i = 0; i < 15; i++) {
    const y = 0.3 + 0.62 * i / 14, az = i * 2.4, top = i >= 12, el = (top ? 58 + 12 * rnd() : 22 + 22 * rnd()) * Math.PI / 180;
    const m = part(blade(0.3 + 0.06 * rnd(), hw, 0.12, 0.5), i % 2 ? B : A, 'Fiddle_Leaf_' + (i + 1));
    m.position.set(0.02 * Math.sin(az), y, 0.02 * Math.cos(az)); m.quaternion.copy(frame(dirOf(az, el), UP, (rnd() - 0.5) * 0.3)); fol.add(m);
  }
}
function areca(fol) {
  const A = mk('Palm_Leaflet_Deep', 0x3a8140, 0, 0.55, { side: DS }), B = mk('Palm_Leaflet_Fresh', 0x4c9a4a, 0, 0.55, { side: DS });
  pinnate(fol, { name: 'Areca', n: 7, h: 0.9, reach: 0.5, L: 0.24, W: 0.016, pairs: 16, ang: 0.9, droop: 0.15, fold: 0.1, droopDir: 0.3, stemR: 0.008,
    hw: t => Math.pow(Math.sin(Math.PI * t), 0.5) * (1 - 0.4 * t), leaf: [A, B], stem: mk('Palm_Rachis', 0x7c9a4e, 0, 0.7) });
}
function zz(fol) {
  const A = mk('ZZ_Leaflet_Glossy', 0x1f6b3f, 0, 0.35, { side: DS }), B = mk('ZZ_Leaflet_Light', 0x2b8a52, 0, 0.35, { side: DS });
  pinnate(fol, { name: 'ZZ', n: 9, h: 0.6, reach: 0.2, L: 0.1, W: 0.05, pairs: 9, ang: 1.2, droop: 0.2, fold: 0.25, droopDir: 0.15, stemR: 0.011,
    hw: t => Math.pow(Math.sin(Math.PI * t), 0.7), leaf: [A, B], stem: mk('ZZ_Stem', 0x3a7a45, 0, 0.5) });
}
function succulent(fol) {
  const A = mk('Succulent_Sage', 0x8bbfa8, 0, 0.55, { side: DS }), B = mk('Succulent_Mint', 0xa6d1b8, 0, 0.55, { side: DS });
  const hw = t => 0.03 * Math.pow(Math.sin(Math.PI * Math.pow(t, 0.6)), 0.7);
  [[10, 20, 0.09], [8, 40, 0.08], [6, 60, 0.065], [4, 76, 0.045]].forEach(([n, elD, L], ring) => {
    for (let i = 0; i < n; i++) {
      const az = i / n * Math.PI * 2 + ring * 0.5, sa = Math.sin(az), ca = Math.cos(az), el = elD * Math.PI / 180;
      const m = part(blade(L, hw, 0.5, 0.15, 6), (i + ring) % 2 ? B : A, `Succulent_Leaf_${ring + 1}_${i + 1}`);
      m.position.set(0.012 * sa, 0.0, 0.012 * ca); m.quaternion.copy(frame(dirOf(az, el), elD > 65 ? new V3(sa, 0, ca) : UP)); fol.add(m);
    }
  });
}

/* label, export name, pot [rimR, baseR, height, sides, hex], target H, target diameter, builder */
const PLANTS = {
  snake:     { label: 'Snake plant (Sansevieria)', file: 'SnakePlant',    pot: [0.14, 0.115, 0.30, 14, 0x45565c], H: 1.05, D: 0.50, fn: snake },
  fiddle:    { label: 'Fiddle-leaf fig',           file: 'FiddleLeafFig', pot: [0.19, 0.14, 0.38, 8, 0xcdd6d8],   H: 1.50, D: 0.70, fn: fiddle },
  areca:     { label: 'Areca palm',                file: 'ArecaPalm',     pot: [0.18, 0.13, 0.34, 10, 0xb9714f],  H: 1.50, D: 1.10, fn: areca },
  zz:        { label: 'ZZ plant',                  file: 'ZZPlant',       pot: [0.15, 0.12, 0.30, 6, 0xebe7de],   H: 0.80, D: 0.65, fn: zz },
  succulent: { label: 'Succulent rosette',         file: 'Succulent',     pot: [0.09, 0.065, 0.12, 8, 0xa7b3b6],  H: 0.24, D: 0.26, fn: succulent }
};

let plant, current;
function build(key) {
  const d = PLANTS[key], [rt, rb, h, seg, hex] = d.pot, soilY = h - 0.04; seed = 11; current = d;
  const root = grp('Office_Indoor_Plant'), planter = grp('Planter');
  const potM = mk('Ceramic_Matte', hex, 0, 0.85), soilM = mk('Potting_Soil', 0x2b211a, 0, 1.0);
  const pts = [[0, 0], [rb, 0], [rt, h], [rt - 0.017, h], [rb - 0.012, 0.03], [0, 0.03]].map(p => new THREE.Vector2(...p));
  planter.add(part(flat(new THREE.LatheGeometry(pts, seg)), potM, 'Pot_Body'));
  const sg = new THREE.CylinderGeometry(rt - 0.022, rt - 0.022, 0.06, seg);
  { const p = sg.attributes.position; for (let i = 0; i < p.count; i++) if (p.getY(i) > 0 && !p.getX(i) && !p.getZ(i)) p.setY(i, p.getY(i) + 0.01); }
  const soil = part(flat(sg), soilM, 'Soil'); soil.position.y = soilY - 0.03; planter.add(soil); root.add(planter);

  const fol = grp('Foliage'); fol.position.y = soilY; d.fn(fol); root.add(fol);
  /* fit foliage to the target size, then bake the scale into the meshes (no non-uniform node scale in the GLB) */
  let fb = exactBox(fol);
  const ext = Math.max(-fb.min.x, fb.max.x, -fb.min.z, fb.max.z), sx = d.D / 2 / ext;
  fol.scale.set(sx, 1, sx); fb = exactBox(fol);
  const sy = (d.H - soilY) / (fb.max.y - soilY); fol.scale.set(1, 1, 1);
  const S = new M4().makeScale(sx, sy, sx);
  fol.children.forEach(o => { o.updateMatrix(); o.geometry.applyMatrix4(S.clone().multiply(o.matrix)); o.geometry.computeVertexNormals();
    o.position.set(0, 0, 0); o.quaternion.identity(); o.scale.set(1, 1, 1); });

  if (plant) scene.remove(plant);
  plant = root; plant.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); scene.add(plant);
  const bb = exactBox(plant), z = bb.getSize(new V3());
  document.getElementById('dims').textContent = `W ${z.x.toFixed(3)} · D ${z.z.toFixed(3)} m  (target ${d.D.toFixed(2)})\nH ${z.y.toFixed(3)} m  (target ${d.H.toFixed(2)})\nPot Ø${(rt * 2).toFixed(2)} × ${h.toFixed(2)} m\nmin Y ${bb.min.y.toFixed(3)} · origin floor`;
  const dist = Math.max(1.8, z.y * 2.2); cam.position.set(dist * 0.6, z.y * 0.8 + 0.3, dist); ctl.target.set(0, z.y * 0.5, 0);
}

/* ============ Preview ============ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.outputEncoding = THREE.sRGBEncoding; renderer.shadowMap.enabled = true;
document.getElementById('v').appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xe8ecee);
const cam = new THREE.PerspectiveCamera(38, 1, 0.05, 50);
const ctl = new THREE.OrbitControls(cam, renderer.domElement);
ctl.enableDamping = true; ctl.maxPolarAngle = Math.PI * 0.495; ctl.autoRotateSpeed = 1.5;

const es = new THREE.Scene(); es.background = new THREE.Color(0x6a7a82);
[[0,3,0,4,.1,4],[3,1,0,.1,2,3],[-3,1,1,.1,2,3],[0,1,3,3,2,.1]].forEach(([x,y,z,w,h,d]) => {
  const p = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshBasicMaterial({ color: 0xffffff })); p.position.set(x,y,z); es.add(p); });
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(es, 0.03).texture;
scene.add(new THREE.HemisphereLight(0xffffff, 0x556068, 0.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.0); sun.position.set(2, 4, 2.5); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -1.5, right: 1.5, top: 2, bottom: -1, near: 0.5, far: 10 });
scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), new THREE.ShadowMaterial({ opacity: 0.22 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
scene.add(new THREE.GridHelper(4, 40, 0xb7c1c7, 0xd0d7db));

function resize() { renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
(function loop() { requestAnimationFrame(loop); ctl.update(); renderer.render(scene, cam); })();

/* ============ UI ============ */
const sel = document.getElementById('type'), st = document.getElementById('st');
Object.entries(PLANTS).forEach(([k, p]) => sel.add(new Option(p.label, k)));
sel.onchange = () => { build(sel.value); st.textContent = 'Drag to orbit · scroll to zoom'; };
document.getElementById('rot').onclick = () => { ctl.autoRotate = !ctl.autoRotate; };
document.getElementById('exp').onclick = () => {
  st.textContent = 'Exporting…'; plant.updateMatrixWorld(true);
  try {
    new THREE.GLTFExporter().parse(plant, buf => {
      const blob = new Blob([buf], { type: 'model/gltf-binary' }), a = document.createElement('a'), fn = `Office_Indoor_Plant_${current.file}.glb`;
      a.href = URL.createObjectURL(blob); a.download = fn;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
      st.textContent = `Exported ${fn} (${(blob.size / 1024).toFixed(0)} KB)`;
    }, { binary: true, onlyVisible: true, truncateDrawRange: true });
  } catch (e) { st.textContent = 'Export failed: ' + e.message; }
};
build('snake');
</script>
</body>
</html>
