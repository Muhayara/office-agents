<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Office_Whiteboard_Scrum — Procedural PBR Generator</title>
<style>
  :root { --bg:#0f172a; --panel:rgba(15,23,42,0.82); --line:rgba(148,163,184,0.25); --txt:#e2e8f0; --mut:#94a3b8; --acc:#38bdf8; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); font-family:"Inter","Segoe UI",system-ui,sans-serif; color:var(--txt); }
  #viewport { position:fixed; inset:0; }
  #panel { position:fixed; top:16px; left:16px; width:300px; padding:18px 18px 14px; background:var(--panel);
           border:1px solid var(--line); border-radius:14px; backdrop-filter:blur(10px); box-shadow:0 10px 40px rgba(0,0,0,.35); }
  h1 { font-size:15px; margin:0 0 2px; letter-spacing:.02em; }
  .sub { font-size:11.5px; color:var(--mut); margin-bottom:14px; line-height:1.45; }
  table { width:100%; border-collapse:collapse; font-size:12px; margin-bottom:14px; }
  td { padding:4px 0; border-bottom:1px solid var(--line); }
  td:last-child { text-align:right; font-variant-numeric:tabular-nums; color:#f8fafc; }
  td:first-child { color:var(--mut); }
  .btns { display:flex; flex-wrap:wrap; gap:8px; }
  button { flex:1 1 auto; font:600 12.5px inherit; font-family:inherit; padding:10px 12px; border-radius:9px; cursor:pointer;
           border:1px solid var(--line); background:rgba(51,65,85,.6); color:var(--txt); transition:.15s; }
  button:hover { background:rgba(71,85,105,.85); }
  button.primary { flex-basis:100%; background:linear-gradient(135deg,#0ea5e9,#2563eb); border:none; color:#fff; font-size:13.5px; }
  button.primary:hover { filter:brightness(1.1); }
  #status { font-size:11px; color:var(--mut); margin-top:10px; min-height:14px; }
  #hint { position:fixed; bottom:14px; right:16px; font-size:11px; color:var(--mut); background:var(--panel);
          padding:6px 10px; border-radius:8px; border:1px solid var(--line); }
</style>
</head>
<body>
<div id="viewport"></div>

<div id="panel">
  <h1>Office_Whiteboard_Scrum</h1>
  <div class="sub">Mobile glass Kanban &amp; Scrum whiteboard on lockable casters. Procedural PBR, metric scale (1 unit = 1 m), front faces +Z.</div>
  <table>
    <tr><td>Width (X)</td><td id="dX">—</td></tr>
    <tr><td>Height (Y)</td><td id="dY">—</td></tr>
    <tr><td>Base depth (Z)</td><td id="dZ">—</td></tr>
    <tr><td>Meshes</td><td id="dM">—</td></tr>
    <tr><td>Triangles</td><td id="dT">—</td></tr>
  </table>
  <div class="btns">
    <button class="primary" id="btnExport">⬇ Export GLB</button>
    <button id="btnRotate">Auto-rotate: Off</button>
    <button id="btnReset">Reset view</button>
    <button id="btnReseed">Shuffle notes</button>
  </div>
  <div id="status"></div>
</div>
<div id="hint">Drag to orbit · Right-drag to pan · Scroll to zoom</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
<script>
(function () {
'use strict';

/* ============================================================
   RENDERER / SCENE
   ============================================================ */
const container = document.getElementById('viewport');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.physicallyCorrectLights = true;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e293b);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.01, 100);
const CAM_HOME = new THREE.Vector3(1.9, 1.45, 3.1);
const TGT_HOME = new THREE.Vector3(0, 0.95, 0);
camera.position.copy(CAM_HOME);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.copy(TGT_HOME);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.4;
controls.maxDistance = 10;
controls.maxPolarAngle = Math.PI * 0.495;
controls.autoRotateSpeed = 0.8;
controls.update();

/* ---------- Procedural environment (studio) for PBR reflections ---------- */
(function buildEnvironment() {
  const pmrem = new THREE.PMREMGenerator(renderer);
  const env = new THREE.Scene();
  const room = new THREE.Mesh(new THREE.BoxGeometry(12, 6, 12),
    new THREE.MeshBasicMaterial({ color: 0x5b6778, side: THREE.BackSide }));
  room.position.y = 2.5;
  env.add(room);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.MeshBasicMaterial({ color: 0x2b3340 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -0.49;
  env.add(floor);
  const lightMat = (i) => new THREE.MeshBasicMaterial({ color: new THREE.Color(i, i, i) });
  const panels = [
    [[4, 0.1, 2], [0, 5.4, 0], lightMat(6)],
    [[0.1, 2.5, 4], [-5.9, 2.8, 1], lightMat(3.5)],
    [[0.1, 2.0, 3], [5.9, 2.5, -1], lightMat(2.5)],
    [[3, 1.8, 0.1], [0, 2.5, 5.9], lightMat(2.8)],
  ];
  panels.forEach(([s, p, m]) => {
    const b = new THREE.Mesh(new THREE.BoxGeometry(...s), m);
    b.position.set(...p); env.add(b);
  });
  scene.environment = pmrem.fromScene(env, 0.04).texture;
  pmrem.dispose();
})();

/* ---------- Lights ---------- */
scene.add(new THREE.HemisphereLight(0xe0f2fe, 0x334155, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.6);
sun.position.set(2.5, 4.2, 3.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -1.6; sun.shadow.camera.right = 1.6;
sun.shadow.camera.top = 2.2; sun.shadow.camera.bottom = -0.6;
sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 10;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.01;
scene.add(sun);
const rim = new THREE.DirectionalLight(0xbfdbfe, 0.9);
rim.position.set(-3, 2.5, -2.5);
scene.add(rim);

/* ---------- Preview floor (not exported) ---------- */
const ground = new THREE.Mesh(new THREE.CircleGeometry(4, 64),
  new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.85, metalness: 0 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(8, 32, 0x64748b, 0x3b4658);
grid.position.y = 0.0005;
grid.material.transparent = true; grid.material.opacity = 0.35;
scene.add(grid);

/* ============================================================
   UTILITIES
   ============================================================ */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function mesh(name, geo, mat, parent, opts) {
  const m = new THREE.Mesh(geo, mat);
  m.name = name;
  m.castShadow = !(opts && opts.noCast);
  m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}

function group(name, parent) {
  const g = new THREE.Group();
  g.name = name;
  if (parent) parent.add(g);
  return g;
}

function canvasTexture(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

/* ============================================================
   MATERIALS (PBR)
   ============================================================ */
const brushedTex = canvasTexture(1024, 64, (ctx, w, h) => {
  ctx.fillStyle = '#d9dde2'; ctx.fillRect(0, 0, w, h);
  const r = mulberry32(77);
  for (let i = 0; i < 1400; i++) {
    const y = r() * h, len = 40 + r() * 400, x = r() * w;
    const v = 190 + Math.floor(r() * 60);
    ctx.strokeStyle = `rgba(${v},${v + 3},${v + 6},${0.25 + r() * 0.35})`;
    ctx.lineWidth = 0.5 + r() * 0.8;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + len, y); ctx.stroke();
  }
});
brushedTex.wrapS = brushedTex.wrapT = THREE.RepeatWrapping;
brushedTex.repeat.set(12, 30);

const MAT = {
  steel: new THREE.MeshStandardMaterial({ name: 'Steel_PowderCoat_White', color: 0xf1f5f9, roughness: 0.35, metalness: 0.3 }),
  plasticCap: new THREE.MeshStandardMaterial({ name: 'Plastic_EndCap_Grey', color: 0xcbd5e1, roughness: 0.55, metalness: 0.0 }),
  casterBlack: new THREE.MeshStandardMaterial({ name: 'Caster_Polyurethane_Black', color: 0x111316, roughness: 0.62, metalness: 0.0 }),
  casterHub: new THREE.MeshStandardMaterial({ name: 'Caster_Housing_Black', color: 0x1f2328, roughness: 0.4, metalness: 0.15 }),
  zinc: new THREE.MeshStandardMaterial({ name: 'Zinc_Plated_Steel', color: 0xb8bec6, roughness: 0.3, metalness: 1.0 }),
  brake: new THREE.MeshStandardMaterial({ name: 'Brake_Lever_Black', color: 0x262a30, roughness: 0.48, metalness: 0.2 }),
  glass: new THREE.MeshPhysicalMaterial({
    name: 'Glass_Tempered_Frosted', color: 0xe2e8f0, roughness: 0.12, metalness: 0.0,
    transmission: 0.85, transparent: true, opacity: 0.95, reflectivity: 0.5,
    clearcoat: 0.3, clearcoatRoughness: 0.15, side: THREE.DoubleSide
  }),
  glassEdge: new THREE.MeshStandardMaterial({ name: 'Glass_Polished_Edge', color: 0xa7d8d0, roughness: 0.1, metalness: 0.0, transparent: true, opacity: 0.85 }),
  clamp: new THREE.MeshStandardMaterial({ name: 'Clamp_Chrome', color: 0xe5e7eb, roughness: 0.18, metalness: 1.0 }),
  etch: new THREE.MeshStandardMaterial({ name: 'Glass_Etched_Line', color: 0xf8fafc, roughness: 0.75, metalness: 0.0, transparent: true, opacity: 0.7, polygonOffset: true, polygonOffsetFactor: -1 }),
  aluminum: new THREE.MeshStandardMaterial({ name: 'Aluminum_Brushed', color: 0xd4d8dd, map: brushedTex, roughness: 0.32, metalness: 0.92 }),
  markerBody: new THREE.MeshStandardMaterial({ name: 'Marker_Barrel_White', color: 0xf8fafc, roughness: 0.38, metalness: 0.0 }),
  capBlack: new THREE.MeshStandardMaterial({ name: 'Marker_Cap_Black', color: 0x0b0d10, roughness: 0.35, metalness: 0.0 }),
  capBlue: new THREE.MeshStandardMaterial({ name: 'Marker_Cap_Blue', color: 0x1d4ed8, roughness: 0.35, metalness: 0.0 }),
  felt: new THREE.MeshStandardMaterial({ name: 'Eraser_Felt_Grey', color: 0x6b7280, roughness: 1.0, metalness: 0.0 }),
  eraserTop: new THREE.MeshStandardMaterial({ name: 'Eraser_Handle_Graphite', color: 0x334155, roughness: 0.45, metalness: 0.05 }),
  magnet: new THREE.MeshStandardMaterial({ name: 'Eraser_Magnet_Strip', color: 0x18181b, roughness: 0.5, metalness: 0.6 }),
};

/* Sticky-note handwriting textures (white base × pastel colour = pastel with ink scribbles) */
function noteTexture(seed) {
  return canvasTexture(256, 256, (ctx, w, h) => {
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
    // adhesive strip tint at the top
    ctx.fillStyle = 'rgba(0,0,0,0.04)'; ctx.fillRect(0, 0, w, 42);
    const r = mulberry32(seed);
    ctx.strokeStyle = 'rgba(30,41,59,0.78)';
    ctx.lineCap = 'round';
    const lines = 2 + Math.floor(r() * 3);
    for (let l = 0; l < lines; l++) {
      const y0 = 70 + l * 42;
      let x = 26;
      const xEnd = 26 + (130 + r() * 90) * (l === lines - 1 ? 0.6 : 1);
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(x, y0);
      while (x < xEnd) {
        x += 6 + r() * 6;
        ctx.lineTo(x, y0 + (r() - 0.5) * 16);
      }
      ctx.stroke();
    }
    // tiny story-point circle
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(w - 44, h - 44, 18, 0, Math.PI * 2); ctx.stroke();
  });
}
const NOTE_COLORS = [
  { name: 'Yellow', hex: 0xfef08a },
  { name: 'Teal', hex: 0xa7f3d0 },
  { name: 'Pink', hex: 0xfbcfe8 },
];
const NOTE_MATS = [];
NOTE_COLORS.forEach((c, ci) => {
  for (let v = 0; v < 2; v++) {
    NOTE_MATS.push(new THREE.MeshStandardMaterial({
      name: `StickyNote_${c.name}_${v + 1}`, color: c.hex, map: noteTexture(100 + ci * 10 + v),
      roughness: 0.82, metalness: 0.0, side: THREE.DoubleSide
    }));
  }
});

function labelMaterial(text) {
  const tex = canvasTexture(512, 128, (ctx, w, h) => {
    ctx.clearRect(0, 0, w, h);
    ctx.font = '700 68px "Inter","Segoe UI",Arial,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(100,116,139,0.92)';
    const spaced = text.split('').join(String.fromCharCode(8202));
    ctx.fillText(spaced, w / 2, h / 2 + 4);
  });
  return new THREE.MeshStandardMaterial({
    name: `Etched_Label_${text}`, map: tex, transparent: true, roughness: 0.7, metalness: 0,
    depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2
  });
}

/* ============================================================
   DIMENSIONAL CONSTANTS (metres)
   ============================================================ */
const D = {
  W: 1.60, H: 1.80, Dz: 0.48,
  postX: 0.775, postR: 0.022,
  footW: 0.05, footH: 0.035, footY0: 0.095,
  casterZ: 0.195,
  wheelR: 0.038, wheelW: 0.017,
  glassW: 1.50, glassH: 1.05, glassT: 0.008, glassY0: 0.67,
  trayY: 0.612, trayZ0: -0.012,
};
D.footY1 = D.footY0 + D.footH;
D.glassCY = D.glassY0 + D.glassH / 2;
D.glassFront = D.glassT / 2;

/* ============================================================
   MODEL BUILDERS
   ============================================================ */
function buildFrame(root) {
  const g = group('Stand_Frame', root);
  const postLen = D.H - D.postR - D.footY1;

  [-1, 1].forEach((s) => {
    const side = s < 0 ? 'L' : 'R';
    const x = s * D.postX;

    // Inverted-T foot: rectangular steel tube along Z
    const foot = mesh(`Foot_${side}`, new THREE.BoxGeometry(D.footW, D.footH, D.Dz - 0.02), MAT.steel, g);
    foot.position.set(x, D.footY0 + D.footH / 2, 0);
    // Rounded top edge of the foot
    const footRound = mesh(`Foot_TopRound_${side}`, new THREE.CylinderGeometry(D.footW / 2, D.footW / 2, D.Dz - 0.02, 24, 1, false, Math.PI / 2, Math.PI), MAT.steel, g);
    footRound.rotation.x = Math.PI / 2;
    footRound.scale.set(1, 1, 0.35);
    footRound.position.set(x, D.footY1, 0);
    // End caps
    [-1, 1].forEach((zs) => {
      const cap = mesh(`Foot_EndCap_${side}_${zs > 0 ? 'F' : 'B'}`, new THREE.BoxGeometry(D.footW + 0.004, D.footH + 0.006, 0.01), MAT.plasticCap, g);
      cap.position.set(x, D.footY0 + D.footH / 2 + 0.001, zs * (D.Dz / 2 - 0.005));
    });
    // Welded base collar at the T junction
    const collar = mesh(`Post_BaseCollar_${side}`, new THREE.CylinderGeometry(D.postR + 0.008, D.postR + 0.014, 0.03, 32), MAT.steel, g);
    collar.position.set(x, D.footY1 + 0.02, 0);
    // Triangular gussets (front & back)
    [-1, 1].forEach((zs) => {
      const sh = new THREE.Shape();
      sh.moveTo(0, 0); sh.lineTo(0.085, 0); sh.lineTo(0, 0.085); sh.lineTo(0, 0);
      const gg = new THREE.ExtrudeGeometry(sh, { depth: 0.006, bevelEnabled: false });
      gg.translate(0, 0, -0.003);
      gg.rotateY(zs > 0 ? -Math.PI / 2 : Math.PI / 2);
      const gus = mesh(`Gusset_${side}_${zs > 0 ? 'F' : 'B'}`, gg, MAT.steel, g);
      gus.position.set(x, D.footY1 + 0.03, zs * (D.postR - 0.004));
    });

    // Vertical upright tube
    const post = mesh(`Upright_${side}`, new THREE.CylinderGeometry(D.postR, D.postR, postLen, 32), MAT.steel, g);
    post.position.set(x, D.footY1 + postLen / 2, 0);
    // Domed top cap -> reaches exactly Y = 1.80
    const dome = mesh(`Upright_TopCap_${side}`, new THREE.SphereGeometry(D.postR, 32, 12, 0, Math.PI * 2, 0, Math.PI / 2), MAT.plasticCap, g);
    dome.position.set(x, D.H - D.postR, 0);
  });

  // Cross-bars
  const span = 2 * D.postX;
  const lower = mesh('CrossBar_Lower', new THREE.CylinderGeometry(0.016, 0.016, span, 24), MAT.steel, g);
  lower.rotation.z = Math.PI / 2; lower.position.set(0, 0.40, 0);
  const upper = mesh('CrossBar_Upper', new THREE.CylinderGeometry(0.016, 0.016, span, 24), MAT.steel, g);
  upper.rotation.z = Math.PI / 2; upper.position.set(0, 1.755, 0);

  // Glass clamp brackets (4x)
  const clampG = group('Glass_Clamps', g);
  [-1, 1].forEach((s) => {
    [D.glassY0 + 0.075, D.glassY0 + D.glassH - 0.075].forEach((y, iy) => {
      const tag = `${s < 0 ? 'L' : 'R'}_${iy ? 'Top' : 'Bot'}`;
      const arm = mesh(`Clamp_Arm_${tag}`, new THREE.CylinderGeometry(0.009, 0.009, 0.03, 16), MAT.clamp, clampG);
      arm.rotation.z = Math.PI / 2; arm.position.set(s * (D.postX - 0.028), y, 0);
      [-1, 1].forEach((zs) => {
        const jaw = mesh(`Clamp_Jaw_${tag}_${zs > 0 ? 'F' : 'B'}`, new THREE.BoxGeometry(0.038, 0.05, 0.007), MAT.clamp, clampG);
        jaw.position.set(s * (D.glassW / 2 - 0.006), y, zs * (D.glassT / 2 + 0.0035));
        const bolt = mesh(`Clamp_Bolt_${tag}_${zs > 0 ? 'F' : 'B'}`, new THREE.CylinderGeometry(0.0065, 0.0065, 0.003, 20), MAT.zinc, clampG);
        bolt.rotation.x = Math.PI / 2;
        bolt.position.set(s * (D.glassW / 2 - 0.008), y, zs * (D.glassT / 2 + 0.0085));
      });
    });
  });
  return g;
}

function buildCaster(parent, name, x, z) {
  const c = group(name, parent);
  c.position.set(x, 0, z);
  const yTop = D.footY0;

  const plate = mesh(`${name}_MountPlate`, new THREE.BoxGeometry(0.05, 0.004, 0.05), MAT.zinc, c);
  plate.position.y = yTop - 0.002;
  const race = mesh(`${name}_SwivelRace`, new THREE.CylinderGeometry(0.021, 0.023, 0.01, 32), MAT.zinc, c);
  race.position.y = yTop - 0.009;

  // Swivel housing (hooded fork)
  const trail = -0.01; // swivel offset: wheel trails slightly
  // Centre housing between the twin wheels (upper half-cylinder, axis along X)
  const hood = mesh(`${name}_Housing`, new THREE.CylinderGeometry(D.wheelR + 0.004, D.wheelR + 0.004, 0.027, 32, 1, false, Math.PI / 2, Math.PI), MAT.casterHub, c);
  hood.rotation.set(Math.PI / 2, 0, Math.PI / 2);
  hood.position.set(0, D.wheelR, trail);
  const neck = mesh(`${name}_Neck`, new THREE.CylinderGeometry(0.014, 0.018, yTop - 0.014 - (D.wheelR + 0.035), 20), MAT.casterHub, c);
  neck.position.y = (yTop - 0.014 + D.wheelR + 0.035) / 2;

  // Twin wheels
  [-1, 1].forEach((s) => {
    const wheel = mesh(`${name}_Wheel_${s < 0 ? 'A' : 'B'}`, new THREE.CylinderGeometry(D.wheelR, D.wheelR, D.wheelW, 40), MAT.casterBlack, c);
    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(s * (D.wheelW / 2 + 0.0145), D.wheelR, trail);
    const tread = mesh(`${name}_Tread_${s < 0 ? 'A' : 'B'}`, new THREE.TorusGeometry(D.wheelR - 0.004, 0.0045, 12, 40), MAT.casterBlack, c);
    tread.rotation.y = Math.PI / 2;
    tread.position.copy(wheel.position);
    tread.position.x += s * (D.wheelW / 2 - 0.004);
    const hub = mesh(`${name}_HubCap_${s < 0 ? 'A' : 'B'}`, new THREE.CylinderGeometry(0.014, 0.014, 0.003, 24), MAT.casterHub, c);
    hub.rotation.z = Math.PI / 2;
    hub.position.set(s * (D.wheelW + 0.0145 + 0.0005), D.wheelR, trail);
  });
  const axle = mesh(`${name}_Axle`, new THREE.CylinderGeometry(0.005, 0.005, 2 * D.wheelW + 0.032, 12), MAT.zinc, c);
  axle.rotation.z = Math.PI / 2; axle.position.set(0, D.wheelR, trail);

  // Foot brake lever (points outward along Z, away from the base centre)
  const out = Math.sign(z) || 1;
  const leverG = group(`${name}_BrakeLever`, c);
  leverG.position.set(0, D.wheelR + 0.032, trail + out * 0.012);
  const arm = mesh(`${name}_BrakeArm`, new THREE.BoxGeometry(0.014, 0.006, 0.05), MAT.brake, leverG);
  arm.position.z = out * 0.025;
  const pedal = mesh(`${name}_BrakePedal`, new THREE.BoxGeometry(0.032, 0.008, 0.022), MAT.brake, leverG);
  pedal.position.set(0, 0.002, out * 0.05);
  for (let i = 0; i < 4; i++) {
    const rib = mesh(`${name}_PedalRib_${i}`, new THREE.BoxGeometry(0.03, 0.0025, 0.0022), MAT.casterHub, leverG, { noCast: true });
    rib.position.set(0, 0.0072, out * (0.042 + i * 0.0055));
  }
  leverG.rotation.x = out * -0.28; // lever angled down = locked position
  return c;
}

function buildCasters(root) {
  const g = group('Casters', root);
  [-1, 1].forEach((sx) => [-1, 1].forEach((sz) => {
    buildCaster(g, `Caster_${sx < 0 ? 'L' : 'R'}${sz > 0 ? 'F' : 'B'}`, sx * D.postX, sz * D.casterZ);
  }));
  return g;
}

function buildGlass(root) {
  const g = group('Glass_Panel', root);
  const panel = mesh('Glass_WritingSurface', new THREE.BoxGeometry(D.glassW, D.glassH, D.glassT), MAT.glass, g, { noCast: true });
  panel.position.set(0, D.glassCY, 0);
  panel.renderOrder = 1;
  // Polished edge band (gives the slab its characteristic green edge)
  const t = 0.0012;
  const edges = [
    ['Top', D.glassW, t, 0, D.glassH / 2 - t / 2], ['Bottom', D.glassW, t, 0, -D.glassH / 2 + t / 2],
    ['Left', t, D.glassH, -D.glassW / 2 + t / 2, 0], ['Right', t, D.glassH, D.glassW / 2 - t / 2, 0],
  ];
  edges.forEach(([n, w, h, x, y]) => {
    const e = mesh(`Glass_Edge_${n}`, new THREE.BoxGeometry(w + 0.0002, h + 0.0002, D.glassT + 0.0002), MAT.glassEdge, g, { noCast: true });
    e.position.set(x, D.glassCY + y, 0);
  });
  return g;
}

function buildKanban(root, seed) {
  const g = group('Kanban_Board', root);
  const zEtch = D.glassFront + 0.0004;
  const top = D.glassY0 + D.glassH;
  const lanes = ['TODO', 'DOING', 'REVIEW', 'DONE'];
  const laneW = D.glassW / lanes.length;

  // Etched column dividers
  const divG = group('Etched_Dividers', g);
  for (let i = 1; i < lanes.length; i++) {
    const x = -D.glassW / 2 + i * laneW;
    const d = mesh(`Divider_${i}`, new THREE.BoxGeometry(0.0025, D.glassH - 0.08, 0.0006), MAT.etch, divG, { noCast: true });
    d.position.set(x, D.glassCY, zEtch);
  }
  // Header rule
  const header = mesh('Divider_HeaderRule', new THREE.BoxGeometry(D.glassW - 0.08, 0.0025, 0.0006), MAT.etch, divG, { noCast: true });
  header.position.set(0, top - 0.105, zEtch);

  // Etched lane labels
  const labG = group('Lane_Labels', g);
  lanes.forEach((name, i) => {
    const x = -D.glassW / 2 + laneW * (i + 0.5);
    const lab = mesh(`Label_${name}`, new THREE.PlaneGeometry(0.22, 0.055), labelMaterial(name), labG, { noCast: true });
    lab.position.set(x, top - 0.058, zEtch + 0.0002);
  });

  // Sticky notes
  const notesG = group('Sticky_Notes', g);
  const rnd = mulberry32(seed);
  const S = 0.076, T = 0.0012;
  const counts = [6, 4, 3, 5]; // TODO / DOING / REVIEW / DONE
  let idx = 0;
  lanes.forEach((lane, li) => {
    const cx = -D.glassW / 2 + laneW * (li + 0.5);
    const n = Math.max(2, counts[li] + Math.floor(rnd() * 3) - 1);
    for (let k = 0; k < n; k++) {
      const col = k % 2, row = Math.floor(k / 2);
      const geo = new THREE.BoxGeometry(S, S, T, 1, 8, 1);
      // Curl the lower half of the note away from the glass (adhesive only at top)
      const pos = geo.attributes.position;
      const curl = 0.5 + rnd() * 0.9;
      for (let v = 0; v < pos.count; v++) {
        const y = pos.getY(v);
        if (y < 0) {
          const u = -y / (S / 2);
          pos.setZ(v, pos.getZ(v) + curl * 0.006 * u * u);
        }
      }
      geo.computeVertexNormals();
      const mat = NOTE_MATS[Math.floor(rnd() * NOTE_MATS.length)];
      const note = mesh(`StickyNote_${lane}_${String(++idx).padStart(2, '0')}`, geo, mat, notesG);
      const x = cx + (col ? 0.085 : -0.085) + (rnd() - 0.5) * 0.022;
      const y = top - 0.18 - row * 0.115 + (rnd() - 0.5) * 0.02;
      note.position.set(x, y, D.glassFront + 0.0006 + T / 2);
      note.rotation.z = (rnd() - 0.5) * 0.16;
    }
  });
  return g;
}

function buildTray(root) {
  const g = group('Marker_Tray', root);
  const len = 2 * (D.postX - D.postR); // spans between the uprights

  // J-channel profile (u = depth toward +Z, v = height)
  const sh = new THREE.Shape();
  const P = [[0, 0], [0.066, 0], [0.066, 0.024], [0.0615, 0.024], [0.0615, 0.004],
             [0.0045, 0.004], [0.0045, 0.038], [0, 0.038]];
  sh.moveTo(P[0][0], P[0][1]);
  for (let i = 1; i < P.length; i++) sh.lineTo(P[i][0], P[i][1]);
  sh.closePath();
  const geo = new THREE.ExtrudeGeometry(sh, { depth: len, bevelEnabled: true, bevelThickness: 0.0006, bevelSize: 0.0006, bevelSegments: 2, steps: 1 });
  geo.rotateY(-Math.PI / 2);          // profile u -> +Z, extrusion -> -X
  geo.translate(len / 2, D.trayY, D.trayZ0);
  mesh('Tray_Channel_Extrusion', geo, MAT.aluminum, g);

  // End caps
  [-1, 1].forEach((s) => {
    const cap = mesh(`Tray_EndCap_${s < 0 ? 'L' : 'R'}`, new THREE.BoxGeometry(0.006, 0.028, 0.068), MAT.plasticCap, g);
    cap.position.set(s * (len / 2 - 0.003), D.trayY + 0.014, D.trayZ0 + 0.033);
  });
  // Mounting brackets to the glass bottom edge
  [-0.5, 0, 0.5].forEach((x, i) => {
    const b = mesh(`Tray_Bracket_${i}`, new THREE.BoxGeometry(0.03, D.glassY0 - (D.trayY + 0.038) + 0.03, 0.004), MAT.zinc, g);
    b.position.set(x, (D.glassY0 + 0.03 + D.trayY + 0.038) / 2, -D.glassT / 2 - 0.002);
  });

  const floorY = D.trayY + 0.004;

  // Dry-erase markers
  function marker(name, capMat, x, z, rotY) {
    const m = group(name, g);
    const r = 0.0088;
    const body = mesh(`${name}_Barrel`, new THREE.CylinderGeometry(r, r, 0.098, 28), MAT.markerBody, m);
    body.rotation.z = Math.PI / 2; body.position.x = -0.012;
    const band = mesh(`${name}_ColorBand`, new THREE.CylinderGeometry(r + 0.0002, r + 0.0002, 0.012, 28), capMat, m);
    band.rotation.z = Math.PI / 2; band.position.x = -0.05;
    const plug = mesh(`${name}_EndPlug`, new THREE.CylinderGeometry(r * 0.92, r * 0.92, 0.004, 28), capMat, m);
    plug.rotation.z = Math.PI / 2; plug.position.x = -0.063;
    const cap = mesh(`${name}_Cap`, new THREE.CylinderGeometry(r + 0.0008, r + 0.0008, 0.046, 28), capMat, m);
    cap.rotation.z = Math.PI / 2; cap.position.x = 0.058;
    const capEnd = mesh(`${name}_CapDome`, new THREE.SphereGeometry(r + 0.0008, 24, 8, 0, Math.PI * 2, 0, Math.PI / 2), capMat, m);
    capEnd.rotation.z = -Math.PI / 2; capEnd.position.x = 0.081; capEnd.scale.y = 0.35;
    const clip = mesh(`${name}_CapClip`, new THREE.BoxGeometry(0.03, 0.0025, 0.004), capMat, m);
    clip.position.set(0.058, r + 0.0018, 0);
    m.position.set(x, floorY + r + 0.0008, z);
    m.rotation.y = rotY;
  }
  marker('Marker_Black', MAT.capBlack, -0.42, D.trayZ0 + 0.019, 0.04);
  marker('Marker_Blue', MAT.capBlue, -0.22, D.trayZ0 + 0.043, -0.06);

  // Magnetic felt eraser block
  const e = group('Eraser_Magnetic', g);
  const ew = 0.12, ed = 0.046;
  const felt = mesh('Eraser_Felt', new THREE.BoxGeometry(ew, 0.008, ed), MAT.felt, e);
  felt.position.y = 0.004;
  const mag = mesh('Eraser_MagnetLayer', new THREE.BoxGeometry(ew - 0.002, 0.003, ed - 0.002), MAT.magnet, e);
  mag.position.y = 0.0095;
  const hs = new THREE.Shape();
  hs.moveTo(-ew / 2, 0); hs.lineTo(ew / 2, 0);
  hs.bezierCurveTo(ew / 2, 0.016, ew / 2 - 0.012, 0.024, ew / 2 - 0.03, 0.024);
  hs.lineTo(-ew / 2 + 0.03, 0.024);
  hs.bezierCurveTo(-ew / 2 + 0.012, 0.024, -ew / 2, 0.016, -ew / 2, 0);
  const hg = new THREE.ExtrudeGeometry(hs, { depth: ed - 0.004, bevelEnabled: true, bevelThickness: 0.0015, bevelSize: 0.0015, bevelSegments: 3, curveSegments: 12 });
  hg.translate(0, 0, -(ed - 0.004) / 2);
  const handle = mesh('Eraser_Handle', hg, MAT.eraserTop, e);
  handle.position.y = 0.011;
  e.position.set(0.36, floorY, D.trayZ0 + 0.033);
  e.rotation.y = 0.05;
  return g;
}

/* ============================================================
   ASSEMBLY
   ============================================================ */
let root = null;
let noteSeed = 20261116;

function disposeTree(obj) {
  obj.traverse((o) => { if (o.isMesh) o.geometry.dispose(); });
}

function build() {
  if (root) { scene.remove(root); disposeTree(root); }
  root = new THREE.Group();
  root.name = 'Office_Whiteboard_Scrum';
  root.userData = {
    description: 'Mobile Glass Kanban & Scrum Whiteboard on Lockable Casters',
    units: 'meters', front: '+Z', origin: 'floor centre between casters'
  };
  buildFrame(root);
  buildCasters(root);
  buildGlass(root);
  buildKanban(root, noteSeed);
  buildTray(root);
  scene.add(root);
  updateStats();
}

function updateStats() {
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  let meshes = 0, tris = 0;
  root.traverse((o) => {
    if (o.isMesh) {
      meshes++;
      const geo = o.geometry;
      tris += geo.index ? geo.index.count / 3 : geo.attributes.position.count / 3;
    }
  });
  document.getElementById('dX').textContent = size.x.toFixed(3) + ' m';
  document.getElementById('dY').textContent = size.y.toFixed(3) + ' m';
  document.getElementById('dZ').textContent = size.z.toFixed(3) + ' m';
  document.getElementById('dM').textContent = meshes;
  document.getElementById('dT').textContent = Math.round(tris).toLocaleString();
}

build();

/* ============================================================
   UI / EXPORT
   ============================================================ */
const statusEl = document.getElementById('status');
document.getElementById('btnExport').addEventListener('click', () => {
  statusEl.textContent = 'Exporting…';
  const exporter = new THREE.GLTFExporter();
  root.updateMatrixWorld(true);
  exporter.parse(root, (result) => {
    const blob = result instanceof ArrayBuffer
      ? new Blob([result], { type: 'model/gltf-binary' })
      : new Blob([JSON.stringify(result)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Office_Whiteboard_Scrum.glb';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    statusEl.textContent = `Exported Office_Whiteboard_Scrum.glb (${(blob.size / 1024).toFixed(0)} KB)`;
  }, { binary: true, onlyVisible: true, maxTextureSize: 1024 });
});

const btnRotate = document.getElementById('btnRotate');
btnRotate.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  btnRotate.textContent = 'Auto-rotate: ' + (controls.autoRotate ? 'On' : 'Off');
});
document.getElementById('btnReset').addEventListener('click', () => {
  camera.position.copy(CAM_HOME); controls.target.copy(TGT_HOME); controls.update();
});
document.getElementById('btnReseed').addEventListener('click', () => {
  noteSeed = (Math.random() * 1e9) | 0; build();
  statusEl.textContent = 'Sticky notes re-scattered.';
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

(function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
})();
})();
</script>
